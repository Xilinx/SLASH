#
# rp1_pipeline connectivity.
#
# Five kernel instances arranged as
#
#                produce
#                   |
#                   X (HBM0)
#                 /   \
#            square   cube
#               |       |
#         (HBM1) Y     Z (HBM2)
#                 \   /
#                combine
#                   |
#                   C (HBM3)
#                   |
#                 reduce  ->  result (s_axilite register)
#
# Each intermediate vector lives in its own HBM channel so the parallel
# square / cube reads don't contend on output writes and combine reads
# Y and Z in parallel from distinct channels.

[connectivity]
nk=produce:1:produce_0
nk=square:1:square_0
nk=cube:1:cube_0
nk=combine:1:combine_0
nk=reduce:1:reduce_0

# X buffer — produced once, consumed by both square and cube.
sp=produce_0.m_axi_gmem0:HBM0
sp=square_0.m_axi_gmem0:HBM0
sp=cube_0.m_axi_gmem0:HBM0

# Y buffer — square output, consumed by combine.
sp=square_0.m_axi_gmem1:HBM1
sp=combine_0.m_axi_gmem0:HBM1

# Z buffer — cube output, consumed by combine.
sp=cube_0.m_axi_gmem1:HBM2
sp=combine_0.m_axi_gmem1:HBM2

# C buffer — combine output, consumed by reduce.
sp=combine_0.m_axi_gmem2:HBM3
sp=reduce_0.m_axi_gmem0:HBM3
