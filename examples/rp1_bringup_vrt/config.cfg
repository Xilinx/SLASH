#
# rp1_bringup_vrt connectivity.
#
# Four instances of bringup_kernel(size, in*) — the diamond DAG dispatches
# them as A -> {B, C} -> D plus a trailing sentinel SIGNAL.  All four
# instances share the same AXI-Lite signature; the linker places them at
# 64 KiB-aligned addresses in alphabetical instance order starting at
# host 0x0202_0000_0000.
#
# Expected layout (see system_map.xml after linking):
#   bringup_kernel_0 → host 0x0202_0000_0000 → R5 0x8800_0000
#   bringup_kernel_1 → host 0x0202_0001_0000 → R5 0x8801_0000
#   bringup_kernel_2 → host 0x0202_0002_0000 → R5 0x8802_0000
#   bringup_kernel_3 → host 0x0202_0003_0000 → R5 0x8803_0000
#
# All four m_axi masters share HBM0; with size=0 (passed by both bringup
# tools) none of them actually issue a transaction.

[connectivity]
nk=bringup_kernel:4

sp=bringup_kernel_0.m_axi_gmem0:HBM0
sp=bringup_kernel_1.m_axi_gmem0:HBM0
sp=bringup_kernel_2.m_axi_gmem0:HBM0
sp=bringup_kernel_3.m_axi_gmem0:HBM0
