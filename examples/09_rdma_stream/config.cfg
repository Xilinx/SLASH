# RDMA from and to the user region: rdma_gen feeds the service's stream
# (rdma.tx), rdma_check takes what it receives (rdma.rx). The linker spreads
# each over two NoC lanes. eth_0's own lanes, 0 and 1, share NoC links from
# the user region to the service layer and carry about 130 Gb/s together;
# lanes 4 and 6 (of eth_2 and eth_3, not used for Ethernet here) carry
# 2 x 102.4 Gb/s both ways.
[network]
eth_0=1
rdma=eth_0
rdma_lanes=4,6

[connectivity]
shell=service
nk=rdma_gen:1:rdma_gen_0
nk=rdma_check:1:rdma_check_0

stream_connect=rdma_gen_0.axis_out:rdma.tx
stream_connect=rdma.rx:rdma_check_0.axis_in
