#
# rp1_pdi_loop variant A connectivity.
#
# A single `pdi_kernel` instance, AXI-Lite only -- no `m_axi`, no
# AXI-Stream.  The kernel writes the magic 0xAAAA_AAAA to its `out`
# output register on `ap_start`; the parent RP1 graph reads that
# register back with a `SCALAR_READ` node.  Since there is no `m_axi`
# master, no `sp=` lines are needed.
#
# Expected layout (see system_map.xml after linking):
#   pdi_kernel_0 -> host 0x0202_0000_0000 -> R5 0x8800_0000
#
# Variant B (config_b.cfg) emits exactly the same instance layout so
# the RP1 graph can `KERNEL_DISPATCH 0x88000000` regardless of which
# partial PDI is currently loaded.

[connectivity]
nk=pdi_kernel:1
