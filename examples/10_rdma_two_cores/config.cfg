# Two RDMA cores, one on each DCMAC port. rdma_gen_<i> feeds the stream of a
# core (rdma_<n>.tx), rdma_check_<i> takes what it receives (rdma_<n>.rx), so
# the cores can send to each other without card memory (--pair --stream).
# The linker picks each core's NoC lanes.
[network]
eth_0=1
eth_2=1
rdma=eth_0,eth_2

[connectivity]
shell=service
nk=rdma_gen:2:rdma_gen_0.rdma_gen_1
nk=rdma_check:2:rdma_check_0.rdma_check_1

stream_connect=rdma_gen_0.axis_out:rdma_0.tx
stream_connect=rdma_0.rx:rdma_check_0.axis_in
stream_connect=rdma_gen_1.axis_out:rdma_2.tx
stream_connect=rdma_2.rx:rdma_check_1.axis_in
