[network]
eth_0=1
rdma=eth_0

[connectivity]
shell=service
nk=rdma_loop:1:rdma_loop_0

stream_connect=rdma.rx:rdma_loop_0.axis_in
stream_connect=rdma_loop_0.axis_out:rdma.tx
