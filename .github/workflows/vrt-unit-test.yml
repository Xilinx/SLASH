name: VRT unit testing

on:
  push:
    branches:
    - main
    - dev
    - feature/vrt-unit-testing
  pull_request:

jobs:
  vrt_unit_tests:
    runs-on: ubuntu-24.04
    permissions: { contents: read }

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install dependencies
        run:
          - apt update
          - apt upgrade -y
          - apt install -y cmake pkg-config ninja-build \
            libxml2-dev libzmq3-dev libjsoncpp-dev zlib1g-dev \
            libsystemd-dev libinih-dev libcli11-dev

      - name: Build and run VRT unit tests
        run:
          - mkdir vrt/build
          - cd vrt/build
          - cmake -DVRT_INCLUDE_VRTD=1 -DVRTD_INCLUDE_LIBSLASH=1 ..
          - make hello_test
          - ./tests/hello_test
          