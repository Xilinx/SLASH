; slash_sysemu daemon configuration.
;
; Declare one [device.<BDF>] section per emulated accelerator.  <BDF> is the PCIe
; Bus:Device.Function address the emulated board should present as, e.g.
; 0000:61:00.  Each device boots against the daemon-wide default VBIN
; (/usr/lib/slash-sysemu/default.vbin) unless a per-device vbin_path overrides it.
;
; The daemon requires at least one [device.*] section and will refuse to start
; without one — which is why the example below ships commented out.  Uncomment
; and adjust it, then:  systemctl enable --now slash-sysemu
;
; Socket identity/mode and the runtime directory are owned by the systemd unit
; (User=/Group=/UMask=/RuntimeDirectory=), not this file.

; [device.0000:61:00]
; ; Optional per-device VBIN (defaults to the daemon-wide default VBIN):
; vbin_path = /path/to/design.vbin
